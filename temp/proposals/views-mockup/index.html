<!doctype html>
<html lang="en" data-theme="white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Views mockup – openconformity</title>
  <link rel="stylesheet" href="../../app/style.css">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <header class="chrome">
    <div class="chrome-row">
      <span class="brand">openconformity</span>
      <span class="crumb">Views mockup · example project · throwaway</span>
      <span class="grow"></span>
      <button type="button" class="action" id="export-csv">CSV of this tab</button>
      <button type="button" class="action" id="export-md">Markdown of the view</button>
      <button type="button" class="action primary" id="print">Print / PDF</button>
    </div>
    <nav class="contained-tabs" id="view-tabs" aria-label="Views"></nav>
  </header>
  <main id="view" class="panel"></main>
  <script type="module" src="mockup.js"></script>
</body>
</html>
