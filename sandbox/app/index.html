<header class="menubar">
  <span class="wordmark" role="img" aria-label="openconformity"></span>
  <nav class="menubar-menus" id="menubar-menus" aria-label="Main"></nav>
</header>

<div class="dropdown-layer" id="dropdown-layer"></div>

<div class="toolbar">
  <button type="button" class="tb-button" id="toolbar-new" aria-haspopup="true" aria-expanded="false">New&nbsp;▾</button>
  <button type="button" class="tb-button" id="toolbar-edit">Edit</button>
  <button type="button" class="tb-button" id="toolbar-delete">Delete</button>
  <span class="tb-separator"></span>
  <span class="tb-context" id="toolbar-context"></span>
</div>

<main class="workspace" id="workspace">

  <div class="column" id="navigator-column">
    <section class="pane" aria-label="Navigator">
      <div class="pane-head">
        <h1 class="pane-title">Navigator</h1>
      </div>
      <div class="pane-filter">
        <input type="search" id="navigator-filter" placeholder="Filter" autocomplete="off" aria-label="Filter the model">
        <button type="button" id="navigator-filter-clear" class="filter-clear" aria-label="Clear the filter">×</button>
      </div>
      <div class="pane-body">
        <div class="tree" id="tree" role="tree" aria-label="Model"></div>
      </div>
    </section>
  </div>

  <div class="splitter splitter-vertical" id="splitter-vertical" role="separator" aria-orientation="vertical" aria-label="Resize the navigator" tabindex="0"></div>

  <div class="column column-main">

    <section class="pane" aria-label="Editor">
      <div class="pane-head">
        <h1 class="pane-title">Editor</h1>
      </div>
      <div class="entity-head" id="editor-head"></div>
      <div class="pane-body editor-body" id="editor-body"></div>
    </section>

    <div class="splitter splitter-horizontal" id="splitter-horizontal" role="separator" aria-orientation="horizontal" aria-label="Resize the relationship pane" tabindex="0"></div>

    <section class="pane pane-relationships" id="relationship-pane" aria-label="Relationships">
      <div class="pane-head">
        <h1 class="pane-title">Relationships</h1>
        <div class="tabs" id="relationship-tabs"></div>
      </div>
      <div class="pane-toolbar" id="relationship-toolbar"></div>
      <div class="pane-body" id="relationship-body"></div>
    </section>

  </div>

</main>

<footer class="statusbar">
  <span id="status-name"></span>
  <span id="status-entities"></span>
  <span id="status-relationships"></span>
</footer>

<input type="file" id="file-input" accept="application/json,.json" hidden>

<script type="module" src="modules/app.js"></script>

</body>
</html>
