<!-- The theme is set before the stylesheet loads, so the first paint is
     already in the right one: the stored choice, else the system preference.
     The key and the values are the store's (store.js). -->
<script>
  document.documentElement.dataset.theme = (function () {
    try {
      var stored = localStorage.getItem('openconformity.theme');
      if (stored === 'white' || stored === 'g100') return stored;
    } catch (error) { /* Storage can be unavailable; fall through. */ }
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'g100' : 'white';
  })();
</script>

<!-- The shell carries what the application is: the identity and the settings
     that change how it presents. Carbon themes the shell bar g100 whatever
     theme the page carries. -->
<header class="shell-bar">
  <a class="wordmark" href="https://openconformity.org" target="_blank" rel="noopener" aria-label="openconformity, the project site"></a>
  <nav class="shell-nav" aria-label="Main">
    <button type="button" class="menubar-item" id="shell-project" aria-haspopup="menu" aria-expanded="false">Project</button>
    <button type="button" class="menubar-item" id="shell-help" aria-haspopup="menu" aria-expanded="false">Help</button>
  </nav>
  <div class="shell-actions">
    <button type="button" class="shell-action shell-action-wide" id="shell-unsaved" hidden>
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-save"/></svg>
      <span>Unsaved changes</span>
    </button>
    <button type="button" class="shell-action" id="shell-metamodel" title="Metamodel" aria-label="Metamodel">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-metamodel"/></svg>
    </button>
    <button type="button" class="shell-action" id="shell-theme" aria-haspopup="menu" aria-expanded="false" title="Theme" aria-label="Theme">
      <svg class="icon" aria-hidden="true" focusable="false"><use id="shell-theme-icon" href="#i-theme-light"/></svg>
    </button>
  </div>
</header>

<input type="file" id="file-input" accept=".json,application/json" hidden>

<!-- Passing statements about the session: a restore that failed, a persist
     that is failing. They inform and block nothing. -->
<div class="notices" id="notices" aria-live="polite"></div>

<main class="workspace" id="workspace">

  <section class="pane pane-navigator" id="pane-navigator" aria-label="Navigator">
    <div class="pane-toolbar" id="navigator-toolbar"></div>
    <div class="search" id="navigator-search" hidden>
      <svg class="icon search-icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
      <input type="search" id="navigator-filter" class="search-input" placeholder="Filter" autocomplete="off" aria-label="Filter the model">
      <button type="button" id="navigator-filter-clear" class="search-clear" aria-label="Clear the filter" hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="pane-body" id="navigator-body"></div>
  </section>

  <div class="splitter splitter-vertical" id="splitter-main" role="separator" aria-orientation="vertical" aria-label="Resize the navigator" tabindex="0"></div>

  <div class="column" id="workspace-column">

    <section class="pane pane-editor" id="pane-editor" aria-label="Editor">
      <div class="pane-head" id="editor-head" hidden></div>
      <div class="pane-body" id="editor-body"></div>
    </section>

    <div class="splitter splitter-horizontal" id="splitter-column" role="separator" aria-orientation="horizontal" aria-label="Resize the relationship pane" tabindex="0"></div>

    <section class="pane pane-relationships" id="pane-relationships" aria-label="Relationships">
      <div class="pane-head" id="relationships-head" hidden></div>
      <div class="pane-body" id="relationships-body"></div>
    </section>

  </div>

</main>

<!-- Passing remarks, such as a refused move: told in the corner, gone by
     themselves, answering nothing. -->
